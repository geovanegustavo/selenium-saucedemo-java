name: CI - Testes E2E (Selenium)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita publicacoes concorrentes no GitHub Pages
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Testes E2E (Chrome headless)
    runs-on: ubuntu-latest

    env:
      # Valores definidos em GitHub Secrets (Settings > Secrets and variables
      # > Actions). O EnvConfig ja faz fallback para variaveis de ambiente
      # quando o .env nao existe (ignoreIfMissing).
      BASE_URL: ${{ secrets.BASE_URL }}
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      PROBLEM_USER: ${{ secrets.PROBLEM_USER }}
      PERFORMANCE_GLITCH_USER: ${{ secrets.PERFORMANCE_GLITCH_USER }}
      INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # O runner ubuntu-latest ja vem com Chrome instalado. O
      # WebDriverManager baixa o chromedriver de forma automatica.
      - name: Executar testes em modo headless
        env:
          HEADLESS: 'true'
        run: mvn -B test

      # Gera o relatorio HTML do Allure (somente para consulta/artefato;
      # o CI passa mesmo quando algum teste falha, por isso o if: always()).
      - name: Gerar relatorio HTML do Allure
        if: always()
        run: mvn -B allure:report

      # Publica um resumo dos testes na propria pagina do GitHub Actions
      # (aba "Summary"), com links para o relatorio no Pages e artefatos.
      - name: Resumo dos resultados no GitHub Actions
        if: always()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import glob, os, re

          tests = failures = errors = skipped = 0
          classes = []
          for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              content = open(f, encoding='utf-8').read()
              m = re.search(r'<testsuite\b[^>]*>', content)
              if not m:
                  continue
              attrs = dict(re.findall(r'(\w+)="([^"]*)"', m.group(0)))
              t = int(attrs.get('tests', 0))
              fa = int(attrs.get('failures', 0))
              er = int(attrs.get('errors', 0))
              sk = int(attrs.get('skipped', 0))
              tests += t; failures += fa; errors += er; skipped += sk
              classes.append((os.path.basename(f), t, fa + er, sk))

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          owner, name = repo.split('/', 1) if '/' in repo else ('', '')
          pages_url = f'https://{owner}.github.io/{name}/' if owner else ''
          run_url = (os.environ.get('GITHUB_SERVER_URL', 'https://github.com')
                     + '/' + repo + '/actions/runs/' + os.environ.get('GITHUB_RUN_ID', ''))

          passed = tests - failures - errors - skipped
          status = '[FAILED]' if (failures + errors) > 0 else '[PASSED]'

          lines = ['## Allure Report', '', f'**Status:** {status}', '']
          lines.append('| Metric | Value |')
          lines.append('| --- | --- |')
          lines.append(f'| Total | {tests} |')
          lines.append(f'| Passed | {passed} |')
          lines.append(f'| Failed | {failures + errors} |')
          lines.append(f'| Skipped | {skipped} |')
          lines.append('')
          if pages_url:
              lines.append(f'**Full Allure report:** [{pages_url}]({pages_url}) (latest run on `main`)')
          lines.append(f'**Artifacts:** [downloads]({run_url}#artifacts)')
          lines.append('')
          if classes:
              lines.append('### Per test class')
              lines.append('')
              lines.append('| Class | Tests | Failed | Skipped |')
              lines.append('| --- | --- | --- | --- |')
              for cname, t, fa, sk in classes:
                  lines.append(f'| `{cname}` | {t} | {fa} | {sk} |')
          lines.append('')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines))
          PYEOF

      - name: Enviar resultados do Allure (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Enviar relatorio HTML do Allure (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn

      - name: Enviar screenshots de falhas (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots
          if-no-files-found: warn

      # --- Publicacao do relatorio no GitHub Pages (apenas no branch main) ---
      # O HTML do Allure nao renderiza pelo visualizador de artefatos do
      # GitHub (usa JS/fetch), por isso e servido via GitHub Pages.

      - name: Configurar GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Preparar relatorio Allure para publicacao
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

      - name: Deploy do relatorio no GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
